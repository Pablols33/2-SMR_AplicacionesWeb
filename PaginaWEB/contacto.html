<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto</title>
</head>
<body>

<nav>
    <a href="index.html">Inicio</a> |
    <a href="contacto.html">Contacto</a> |
    <a href="horario.html">Horario</a>
</nav>

<h2>Formulario de contacto</h2>

    <form action="datos.php" method="POST">
        <fieldset>
            <legend>Datos personales</legend>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre"><br>
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos" placeholder="Escribe tus apellidos"><br>
            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@email.com"><br>
            <label for="pass">Contraseña:</label>
            <input type="password" id="pass" name="pass"><br>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" value="18"><br>
        </fieldset>

        <fieldset>
            <legend>Ciudad</legend>
            <select name="ciudad">
            <option>Jaén</option>
            <option>Granada</option>
            <option>Sevilla</option>
            <option>Córdoba</option>
            <option>Malaga</option>
            <option>Almeria</option>
            <option>Cadiz</option>
            </select>
        </fieldset>

        <fieldset>
        <legend>Aficiones</legend>
        <input type="checkbox" name="aficiones" checked> Videojuegos
        <input type="checkbox" name="aficiones"> Música
        <input type="checkbox" name="aficiones"> Deporte
        <input type="checkbox" name="aficiones"> Cine
        </fieldset>

        <label for="comentario"> Comentarios:</label> <br>
        <textarea id="comentario" name="comentario" rows="10" cols="40"></textarea> <br>
        <button type="submit"> Enviar</button>
        <button type="reset"> Borrar</button>
    </form>
</body>
</html>
